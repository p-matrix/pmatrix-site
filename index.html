<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090c12" />
  <meta name="description" content="P-MATRIX — AI-native, cross-principal collaboration on the Agentic Web. Self · Other · We." />
  <title>P-MATRIX</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --paper: #f5f7fb;
      --subtle: #b0b7c4;
      --muted: #7b8797;
      --blue: #88c6fa;
      --mint: #a7e2db;
      --violet: #b8b5ef;
      --line: rgba(181, 203, 231, .15);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; background: var(--bg); }
    body {
      margin: 0; min-height: 100%; overflow-x: hidden;
      color: var(--paper); background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .landing {
      isolation: isolate;
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: clamp(48px, 8vh, 88px) 24px;
      background:
        radial-gradient(ellipse 55% 42% at 50% 49%, rgba(39, 68, 107, .14), transparent 72%),
        radial-gradient(ellipse 42% 62% at -10% 110%, rgba(33, 87, 105, .12), transparent 72%),
        radial-gradient(ellipse 42% 62% at 110% -10%, rgba(54, 46, 94, .12), transparent 72%),
        #080b10;
    }
    .landing::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
      background-image:
        linear-gradient(to right, rgba(151, 171, 199, .055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(151, 171, 199, .055) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.6), transparent 76%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.6), transparent 76%);
    }
    .landing::after {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(180deg, rgba(5,8,12,.24), transparent 26%, transparent 78%, rgba(5,8,12,.36));
    }
    .orbital {
      pointer-events: none;
      position: absolute;
      width: min(1050px, 135vw);
      aspect-ratio: 1;
      left: 50%; top: 48.4%;
      transform: translate(-50%, -50%);
      z-index: -1;
      opacity: .84;
    }
    .orbital .orbit { fill: none; stroke: rgba(176, 194, 217, .09); stroke-width: 1; }
    .orbital .orbit-2 { stroke: rgba(176, 194, 217, .06); }
    .orbital .accent-path { stroke: url(#arc); fill: none; stroke-width: 1.25; opacity: .48; stroke-linecap: round; }
    .orbital .node-halo { fill: rgba(129,200,245,.07); }
    .orbital .node-core { fill: #c4eaff; filter: drop-shadow(0 0 8px rgba(115, 194, 253,.7)); }
    .orbital .node-alt { fill: #bfd5ff; filter: drop-shadow(0 0 7px rgba(130, 144, 254,.65)); }
    .orbital .node-mint { fill: #afe5dc; filter: drop-shadow(0 0 7px rgba(130, 235, 199,.65)); }
    .orbital .triad { transform-origin: 500px 500px; animation: gentle-turn 70s linear infinite; }
    .orbital .pulse { animation: pulse 4.5s ease-in-out infinite; transform-origin: center; }
    .orbital .pulse:nth-of-type(3) { animation-delay: -1.6s; }
    .orbital .pulse:nth-of-type(4) { animation-delay: -3.2s; }
    .halo {
      position: absolute; width: min(800px, 105vw); aspect-ratio: 1;
      left: 50%; top: 47%; transform: translate(-50%, -50%); z-index: -1;
      background: radial-gradient(circle, rgba(66, 105, 153, .08), rgba(27, 45, 69, .045) 35%, transparent 69%);
      filter: blur(8px);
    }
    .content {
      width: min(100%, 1180px);
      text-align: center;
      display: flex;
      align-items: center;
      flex-direction: column;
      position: relative;
      z-index: 1;
      margin-top: clamp(-32px, -2.5vh, -10px);
    }
    /* CI Book tetrahedron: preserve geometry, match its inner moving node to the ambient orbit nodes. */
    .symbol {
      width: clamp(100px, 10vw, 130px);
      height: clamp(100px, 10vw, 130px);
      margin-bottom: clamp(26px, 3.8vh, 44px);
      overflow: visible;
      animation: appear .9s .05s both ease-out;
    }
    .tetra-frame { stroke: #A9BDD8; stroke-width: 1.08; opacity: .88; }
    .tetra-inner { stroke: #8DA6C8; stroke-width: .62; opacity: .46; }
    .tetra-vertex { fill: #B8C8DE; opacity: .58; }
    /* The inner node shares the same icy luminosity and pulse as the orbiting background nodes. */
    .tetra-dot { animation: tetra-wander 8.5s ease-in-out infinite; }
    .tetra-halo { fill: rgba(129,200,245,.07); animation: pulse 4.5s ease-in-out infinite; }
    .tetra-core { fill: #c4eaff; filter: drop-shadow(0 0 8px rgba(115, 194, 253,.7)); animation: pulse 4.5s ease-in-out infinite; }
    /* The wireframe remains static. Only the node glides inside its bounds. */
    @keyframes tetra-wander {
      0%, 100% { transform: translate(0, 0); }
      18% { transform: translate(7px, -5px); }
      38% { transform: translate(2px, -10px); }
      58% { transform: translate(-7px, -3px); }
      77% { transform: translate(-5px, 8px); }
      90% { transform: translate(6px, 5px); }
    }
    .brand {
      font-weight: 500;
      line-height: .94;
      letter-spacing: -.045em;
      font-size: clamp(3.08rem, 8.08vw, 7.62rem);
      margin: 0;
      color: #f5f7ff;
      text-shadow: 0 8px 54px rgba(139, 170, 220, .08);
      animation: rise 1s .12s both cubic-bezier(.2,.8,.25,1);
      white-space: nowrap;
      padding-right: .06em;
    }
    .rule {
      margin: clamp(30px, 5.2vh, 52px) auto clamp(25px, 4.1vh, 42px);
      width: clamp(56px, 6vw, 86px); height: 1px;
      background: linear-gradient(90deg, transparent, rgba(179,211,249,.85), transparent);
      animation: appear 1.2s .4s both ease-out;
    }
    .tagline {
      font-size: clamp(1.02rem, 1.65vw, 1.42rem);
      font-weight: 370;
      line-height: 1.65;
      letter-spacing: -.025em;
      color: #d4dbe7;
      margin: 0;
      text-wrap: balance;
      max-width: 850px;
      animation: rise .9s .35s both cubic-bezier(.2,.8,.25,1);
    }
    .tagline strong { font-weight: 500; color: #fff; }
    .philosophy {
      margin-top: clamp(64px, 11vh, 122px);
      animation: rise .9s .6s both cubic-bezier(.2,.8,.25,1);
      display: grid; gap: 17px; justify-items: center;
    }
    .values {
      margin: 0;
      font-size: clamp(.8rem, 1vw, .93rem);
      font-weight: 380;
      letter-spacing: -.045em;
      line-height: 1.15;
      color: #929baa;
      white-space: nowrap;
    }
    .values .dot { color: var(--blue); font-size: .8em; font-weight: 300; margin: 0 .38em; }
    .system {
      margin: 0;
      color: #f3f6fb;
      font-size: clamp(.98rem, 1.4vw, 1.22rem);
      letter-spacing: .06em;
      font-weight: 550;
      line-height: 1.5;
      white-space: nowrap;
    }
    .system .dot { color: #667b94; margin: 0 .62em; }
    .corner {
      position: absolute; width: 27px; height: 27px; opacity: .38; pointer-events: none;
    }
    .corner.tl { top: clamp(23px, 3.3vw, 44px); left: clamp(23px, 3.3vw, 44px); border-left: 1px solid #7c96b1; border-top: 1px solid #7c96b1; }
    .corner.tr { top: clamp(23px, 3.3vw, 44px); right: clamp(23px, 3.3vw, 44px); border-right: 1px solid #7c96b1; border-top: 1px solid #7c96b1; }
    .corner.bl { bottom: clamp(23px, 3.3vw, 44px); left: clamp(23px, 3.3vw, 44px); border-left: 1px solid #7c96b1; border-bottom: 1px solid #7c96b1; }
    .corner.br { bottom: clamp(23px, 3.3vw, 44px); right: clamp(23px, 3.3vw, 44px); border-right: 1px solid #7c96b1; border-bottom: 1px solid #7c96b1; }
    @keyframes rise { from { opacity: 0; transform: translateY(21px); filter: blur(6px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes appear { from {opacity:0;} to {opacity:1;} }
    @keyframes gentle-turn { from {transform:rotate(0)} to {transform:rotate(360deg)} }
    @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
    @media (max-width: 680px) {
      .landing { padding: 72px 18px 56px; }
      .content { margin-top: -12px; }
      .orbital { width: 175vw; top: 48%; opacity: .65; }
      .symbol { width: 104px; height: 104px; margin-bottom: clamp(29px, 4.5vh, 43px); }
      .brand { font-size: clamp(2.46rem, 10.94vw, 4.47rem); letter-spacing: -.045em; }
      .rule { margin-top: 40px; margin-bottom: 28px; }
      .tagline { font-size: clamp(1.06rem, 4.15vw, 1.23rem); line-height: 1.65; max-width: 340px; }
      .philosophy { margin-top: clamp(75px, 12vh, 100px); gap: 14px; }
      .values { font-size: .8rem; }
      .system { font-size: .95rem; letter-spacing: .07em; }
      .corner { width: 17px; height: 17px; opacity: .28; }
    }
    @media (max-width: 370px) {
      .brand { font-size: 10.7vw; }
      .values { font-size: .78rem; }
      .values .dot { margin: 0 .24em; }
      .system { font-size: .9rem; }
      .system .dot { margin: 0 .37em; }
    }
    @media (max-height: 650px) and (min-width: 681px) {
      .landing { padding-top: 36px; padding-bottom: 36px; }
      .symbol { margin-bottom: 18px; width: 78px; height: 78px; }
      .brand { font-size: clamp(3.08rem, 7.7vh, 5.39rem); }
      .rule { margin: 25px 0 18px; }
      .philosophy { margin-top: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="landing" aria-label="P-MATRIX landing page">
    <span class="corner tl" aria-hidden="true"></span>
    <span class="corner tr" aria-hidden="true"></span>
    <span class="corner bl" aria-hidden="true"></span>
    <span class="corner br" aria-hidden="true"></span>
    <div class="halo" aria-hidden="true"></div>
    <svg class="orbital" viewBox="0 0 1000 1000" role="presentation" aria-hidden="true">
      <defs>
        <linearGradient id="arc" x1="100" y1="150" x2="840" y2="850" gradientUnits="userSpaceOnUse"><stop stop-color="#86bffe" stop-opacity="0"/><stop offset=".43" stop-color="#7ebce8" stop-opacity=".48"/><stop offset=".72" stop-color="#a4e4da" stop-opacity=".50"/><stop offset="1" stop-color="#86bffe" stop-opacity="0"/></linearGradient>
      </defs>
      <circle class="orbit" cx="500" cy="500" r="405" />
      <circle class="orbit orbit-2" cx="500" cy="500" r="318" />
      <circle class="orbit orbit-2" cx="500" cy="500" r="475" />
      <g class="triad">
        <path class="accent-path" d="M 254 178 A 405 405 0 0 1 895 582" />
        <path class="accent-path" d="M 895 582 A 405 405 0 0 1 254 178" opacity=".22" />
        <g class="pulse"><circle class="node-halo" cx="254" cy="178" r="17"/><circle class="node-core" cx="254" cy="178" r="3.5"/></g>
        <g class="pulse"><circle class="node-halo" cx="895" cy="582" r="17"/><circle class="node-alt" cx="895" cy="582" r="3.5"/></g>
        <g class="pulse"><circle class="node-halo" cx="365" cy="882" r="17"/><circle class="node-mint" cx="365" cy="882" r="3.5"/></g>
      </g>
    </svg>
    <div class="content">
      <!-- The original CI Book v2.0 geometry, enlarged for legibility. -->
      <svg class="symbol" viewBox="0 0 80 80" aria-label="P-MATRIX 정사면체 로고: 내부에서 움직이는 균형점" role="img">
        <path class="tetra-frame" d="M40 8L72 60L8 60Z" fill="none" stroke-linejoin="round"/>
        <path class="tetra-inner" d="M40 8L40 43 M8 60L40 43 M72 60L40 43" fill="none"/>
        <g class="tetra-dot">
          <circle class="tetra-halo" cx="40" cy="43" r="7.4" />
          <circle class="tetra-core" cx="40" cy="43" r="2.9" />
        </g>
      </svg>
      <h1 class="brand">P-MATRIX</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline">AI-native, cross-principal collaboration on the Agentic Web.</p>
      <div class="philosophy">
        <p class="system">P-NODE<span class="dot">·</span>P-LINK<span class="dot">·</span>P-FIELD</p>
        <p class="values">Self<span class="dot">·</span>Other<span class="dot">·</span>We</p>
      </div>
    </div>
  </main>
</body>
</html>
